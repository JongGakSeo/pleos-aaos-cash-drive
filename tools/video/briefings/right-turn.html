<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>브리핑 영상: 우회전, 먼저 멈춰요</title>
<!--
  Scene source of creatives/brief-right-turn.mp4 (BriefingCatalog id right-turn-stop). 1080x1080, 15 s,
  four scenes on the caption cues 0 / 4 / 8 / 12 s with 0.4 s crossfades centred on the cues. No
  sentence is drawn here: the app draws the caption pill over the bottom of the picture, so the bottom
  fifth stays road and grass. window.renderAt(seconds) draws one exact frame; opened in a browser the
  page previews itself in real time (append ?t=5.5 to hold one moment).
  Render: node tools/video/render_briefing.mjs right-turn android/app/src/main/assets/creatives/brief-right-turn.mp4
-->
<style>
  html, body { margin: 0; background: #0E0F11; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  svg { display: block; }
  text { font-family: "Apple SD Gothic Neo", sans-serif; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <radialGradient id="glowRed"><stop offset="0" stop-color="#FF6B5E" stop-opacity=".95"/><stop offset=".45" stop-color="#FF6B5E" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B5E" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowAmber"><stop offset="0" stop-color="#FFC24A" stop-opacity=".95"/><stop offset=".45" stop-color="#FFB02E" stop-opacity=".35"/><stop offset="1" stop-color="#FFB02E" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGreen"><stop offset="0" stop-color="#5FD69E" stop-opacity=".9"/><stop offset=".45" stop-color="#5FD69E" stop-opacity=".3"/><stop offset="1" stop-color="#5FD69E" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#6F98FF" stop-opacity=".95"/><stop offset=".45" stop-color="#6F98FF" stop-opacity=".35"/><stop offset="1" stop-color="#6F98FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="endSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD8EE"/><stop offset=".55" stop-color="#EAF1F6"/></linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".74"><stop offset=".7" stop-color="#0E0F11" stop-opacity="0"/><stop offset="1" stop-color="#0E0F11" stop-opacity=".08"/></radialGradient>
    <linearGradient id="calmFade" x1="0" y1="0" x2="0" y2="1"><stop offset=".72" stop-color="#FFFFFF"/><stop offset=".9" stop-color="#2A2A2A"/></linearGradient>
    <mask id="calmBottom" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080"><rect width="1080" height="1080" fill="url(#calmFade)"/></mask>
  </defs>
</svg>
<script>
'use strict';
/* ===== Series kit: keep this block identical in right-turn.html, school-zone.html and emergency-yield.html ===== */
const W = 1080, H = 1080, DURATION = 15, FADE = 0.4;
const NS = 'http://www.w3.org/2000/svg';
const SVG = document.getElementById('stage');
/** Day palette of the home diorama (godot/ThemeBackdrop.gd) and the top-down companions in its family. */
const PAL = {
  sky1: '#BFD8EE', sky2: '#EAF1F6', disc: '#FFE9B8', halo: '#FFF4DA', cloud: '#FFFFFF', farthest: '#DCE5EB',
  far: '#C9D6DC', near: '#A9BCC6', trees: '#7F9AA6', grass: '#A9C29A', blade: '#A9BCC6', road: '#4A4D55',
  curb: '#D9D4C6', lane: '#3C3F46', dash: '#E6E6E6', post: '#8C929B', amber: '#E0A93C',
  walk: '#DDD8CC', walkEdge: '#C9C3B4', lawn: '#A9C29A', lawnDeep: '#97B489', crown: '#82A193', crownLit: '#9BB8A6', crownDeep: '#728F83',
  paint: '#EDECE7', centre: '#E5C565', shadow: '#1E2731', housing: '#3B3F47', lampOff: '#5A5F69',
  red: '#E9655A', yellow: '#F2C14E', green: '#4CC48C',
};

function el(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  if (attrs) for (const key in attrs) node.setAttribute(key, attrs[key]);
  if (parent) parent.appendChild(node);
  return node;
}
function set(node, attrs) { for (const key in attrs) node.setAttribute(key, attrs[key]); }
const n2 = (v) => Math.round(v * 100) / 100;
const n3 = (v) => Math.round(v * 1000) / 1000;
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, p) => a + (b - a) * p;
/** Progress of t through [a, b], 0 before and 1 after. */
const span = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (p) => p * p * (3 - 2 * p);
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const backOut = (p) => 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2);
/** 0 -> 1 -> 0 over [a, b]. */
const bump = (t, a, b) => Math.sin(Math.PI * span(t, a, b));
/** A soft on/off wave at hz. Every light that blinks in this series stays at or under 2 Hz. */
const blink = (t, hz, phase = 0) => smooth(clamp(0.5 + Math.sin(2 * Math.PI * (hz * t + phase)) / 0.6));
const rad = (d) => (d * Math.PI) / 180;

/**
 * Position on a track of keys [t, value, velocity]: cubic Hermite between keys (velocity 0 at a key
 * is a smooth stop or start), straight extrapolation past either end. Vehicles, people and cameras
 * all move on tracks, so a frame depends on t alone.
 */
function track(t, keys) {
  const first = keys[0], last = keys[keys.length - 1];
  if (t <= first[0]) return first[1] + first[2] * (t - first[0]);
  if (t >= last[0]) return last[1] + last[2] * (t - last[0]);
  let i = 1;
  while (keys[i][0] < t) i++;
  const [t0, s0, v0] = keys[i - 1], [t1, s1, v1] = keys[i];
  const d = t1 - t0, p = (t - t0) / d, p2 = p * p, p3 = p2 * p;
  return (2 * p3 - 3 * p2 + 1) * s0 + (p3 - 2 * p2 + p) * d * v0 + (-2 * p3 + 3 * p2) * s1 + (p3 - p2) * d * v1;
}
/** Speed on a track at t (units per second). */
const speedOn = (t, keys) => (track(t + 0.01, keys) - track(t - 0.01, keys)) / 0.02;

/**
 * A drive route from (x, y) at heading degrees (0 up, 90 right): parts are {line: length} and
 * {turn: +-degrees, radius} (positive turns right). poseAt(route, s) is the pose s units along it.
 */
function route(x, y, heading, parts) {
  const segs = [];
  let length = 0;
  for (const part of parts) {
    if (part.line !== undefined) {
      segs.push({ line: true, x, y, h: heading, from: length, len: part.line });
      x += part.line * Math.sin(rad(heading));
      y -= part.line * Math.cos(rad(heading));
      length += part.line;
    } else {
      const dir = Math.sign(part.turn), R = part.radius;
      const cx = x + dir * R * Math.cos(rad(heading)), cy = y + dir * R * Math.sin(rad(heading));
      const len = R * rad(Math.abs(part.turn));
      segs.push({ line: false, cx, cy, R, dir, h: heading, from: length, len });
      heading += part.turn;
      x = cx - dir * R * Math.cos(rad(heading));
      y = cy - dir * R * Math.sin(rad(heading));
      length += len;
    }
  }
  segs.push({ line: true, x, y, h: heading, from: length, len: Infinity });
  return { segs, length };
}
function poseAt(rt, s) {
  const seg = s < 0 ? rt.segs[0] : rt.segs.find((g) => s <= g.from + g.len);
  const d = s - seg.from;
  if (seg.line) return { x: seg.x + d * Math.sin(rad(seg.h)), y: seg.y - d * Math.cos(rad(seg.h)), h: seg.h };
  const h = seg.h + seg.dir * (d / seg.R) * (180 / Math.PI);
  return { x: seg.cx - seg.dir * seg.R * Math.cos(rad(h)), y: seg.cy - seg.dir * seg.R * Math.sin(rad(h)), h };
}
/** SVG path data of a route from s0 to s1 (sampled every 6 units). */
function routePath(rt, s0, s1) {
  const pts = [];
  for (let s = s0; s < s1; s += 6) pts.push(poseAt(rt, s));
  pts.push(poseAt(rt, s1));
  return pts.map((p, i) => `${i ? 'L' : 'M'}${n2(p.x)} ${n2(p.y)}`).join('');
}

/** Frames a group: the world point (cx, cy) at the centre of the picture, zoomed. */
function aim(group, cx, cy, zoom) {
  set(group, { transform: `translate(${W / 2} ${H / 2}) scale(${n3(zoom)}) translate(${n2(-cx)} ${n2(-cy)})` });
}

/* ---- Vehicles: top-down, nose up at heading 0, rounded and outline-free ---- */
const CAR_LOOKS = {
  hero: { body: '#E0A93C', roof: '#EDC266', edge: '#C48D2E', glass: '#D5E3EC', sheen: '#FFF1CF' },
  white: { body: '#F2F1EC', roof: '#FBFBF8', edge: '#D2D0C8', glass: '#C3D3DF', sheen: '#FFFFFF' },
  silver: { body: '#BEC4CC', roof: '#CED3DA', edge: '#A3AAB4', glass: '#D2DEE7', sheen: '#F4F6F8' },
  slate: { body: '#8FA4B7', roof: '#A3B6C7', edge: '#7A8FA3', glass: '#D5E1EA', sheen: '#E8EEF4' },
};
function car(parent, lookName) {
  const L = CAR_LOOKS[lookName];
  const g = el('g', {}, parent);
  const shadow = el('g', {}, g);
  const shadowBody = el('rect', { x: -46, y: -80, width: 92, height: 164, rx: 34, fill: PAL.shadow, opacity: 0.26, filter: 'url(#blur4)' }, shadow);
  const glowBack = el('g', {}, g);
  const brakeGlow = [-30, 30].map((x) => el('ellipse', { cx: x, cy: 88, rx: 26, ry: 18, fill: 'url(#glowRed)', opacity: 0 }, glowBack));
  const blinkGlow = {};
  for (const side of ['L', 'R']) {
    const sx = side === 'R' ? 40 : -40;
    blinkGlow[side] = [el('circle', { cx: sx, cy: -74, r: 22, fill: 'url(#glowAmber)', opacity: 0 }, glowBack),
      el('circle', { cx: sx, cy: 76, r: 22, fill: 'url(#glowAmber)', opacity: 0 }, glowBack)];
  }
  const body = el('g', {}, g);
  for (const [x, y] of [[-49, -56], [41, -56], [-49, 34], [41, 34]]) el('rect', { x, y, width: 8, height: 24, rx: 3, fill: '#2F333A' }, body);
  el('rect', { x: -46, y: -84, width: 92, height: 168, rx: 34, fill: L.body, stroke: L.edge, 'stroke-width': 1.5 }, body);
  el('ellipse', { cx: 0, cy: -62, rx: 30, ry: 11, fill: L.sheen, opacity: 0.28 }, body);
  el('path', { d: 'M-35 -36 Q0 -48 35 -36 L31 -14 Q0 -20 -31 -14 Z', fill: L.glass }, body);
  el('rect', { x: -32, y: -14, width: 64, height: 54, rx: 15, fill: L.roof }, body);
  el('path', { d: 'M-31 42 Q0 48 31 42 L33 56 Q0 63 -33 56 Z', fill: L.glass, opacity: 0.9 }, body);
  for (const x of [-1, 1]) el('ellipse', { cx: x * 50, cy: -26, rx: 8, ry: 5, fill: L.body, stroke: L.edge, 'stroke-width': 1.2 }, body);
  for (const x of [-37, 19]) el('rect', { x, y: -83, width: 18, height: 7, rx: 3.5, fill: '#FFF6DE' }, body);
  const tails = [-38, 20].map((x) => el('rect', { x, y: 76, width: 18, height: 7, rx: 3.5, fill: '#B9554D' }, body));
  const lamps = {};
  for (const side of ['L', 'R']) {
    const sx = side === 'R' ? 37 : -37;
    lamps[side] = [el('circle', { cx: sx, cy: -73, r: 4.5, fill: '#F6C25A', opacity: 0 }, body), el('circle', { cx: sx, cy: 75, r: 4.5, fill: '#F6C25A', opacity: 0 }, body)];
  }
  return {
    g,
    /** pose {x, y, h}; brake 0..1; blinker 0..1 for side 'L' or 'R'; alpha for ghosts. */
    set(pose, o = {}) {
      set(g, { transform: `translate(${n2(pose.x)} ${n2(pose.y)})`, opacity: n3(o.alpha ?? 1) });
      set(shadow, { transform: `translate(6 9) rotate(${n2(pose.h)})` });
      set(glowBack, { transform: `rotate(${n2(pose.h)})` });
      set(body, { transform: `rotate(${n2(pose.h)})` });
      const brake = o.brake ?? 0;
      brakeGlow.forEach((e) => set(e, { opacity: n3(brake * 0.85) }));
      tails.forEach((e) => set(e, { fill: brake > 0.5 ? '#FF6155' : '#B9554D' }));
      for (const side of ['L', 'R']) {
        const on = o.side === side ? (o.blinker ?? 0) : 0;
        blinkGlow[side].forEach((e) => set(e, { opacity: n3(on) }));
        lamps[side].forEach((e) => set(e, { opacity: n3(on) }));
      }
    },
  };
}

/* ---- People: upright chibi figures standing on the map, feet at the origin ---- */
function person(parent, look) {
  const k = look.child ? 0.8 : 1;
  const g = el('g', {}, parent);
  el('ellipse', { cx: 0, cy: 1, rx: 19 * k, ry: 6.5 * k, fill: PAL.shadow, opacity: 0.24, filter: 'url(#blur2)' }, g);
  const fig = el('g', {}, g);
  const hipY = -22 * k, shoulderY = -48 * k;
  const legs = [-1, 1].map((sx) => {
    const leg = el('g', {}, fig);
    el('rect', { x: -5.5 * k, y: -2, width: 11 * k, height: 23 * k, rx: 5 * k, fill: look.pants }, leg);
    el('ellipse', { cx: 0, cy: 21 * k, rx: 7 * k, ry: 4 * k, fill: '#3A3F48' }, leg);
    return { leg, x: sx * 7.5 * k };
  });
  if (look.bag) el('rect', { x: -19 * k, y: -50 * k, width: 38 * k, height: 32 * k, rx: 10 * k, fill: look.bag }, fig);
  el('rect', { x: -16 * k, y: -52 * k, width: 32 * k, height: 34 * k, rx: 13 * k, fill: look.shirt }, fig);
  const arms = [-1, 1].map((sx) => {
    const arm = el('g', {}, fig);
    const sleeve = el('rect', { x: -4.5 * k, y: -2, width: 9 * k, height: 25 * k, rx: 4.5 * k, fill: look.shirt }, arm);
    const hand = el('circle', { cx: 0, cy: 22 * k, r: 5 * k, fill: look.skin }, arm);
    return { arm, sleeve, hand, x: sx * 17 * k };
  });
  const headY = -68 * k - (look.child ? 2 : 0);
  const headR = look.child ? 18 : 19;
  const head = el('g', { transform: `translate(0 ${headY})` }, fig);
  el('circle', { cx: 0, cy: 0, r: headR, fill: look.skin }, head);
  const face = el('g', {}, head);
  for (const x of [-6.5, 6.5]) el('ellipse', { cx: x, cy: 2, rx: 2.4, ry: 2.8, fill: '#2C2320' }, face);
  for (const x of [-11, 11]) el('ellipse', { cx: x, cy: 8, rx: 4, ry: 2.4, fill: '#EE9A86', opacity: 0.5 }, face);
  if (look.cap) {
    el('path', { d: `M${-headR - 1} -1 A${headR + 1} ${headR + 2} 0 0 1 ${headR + 1} -1 Z`, fill: look.cap }, head);
    el('path', { d: `M${-headR - 2} -2 Q0 4 ${headR + 2} -2 L${headR + 2} 1 Q0 7 ${-headR - 2} 1 Z`, fill: '#D9A92C' }, head);
  } else {
    el('path', { d: `M${-headR} 1 C${-headR} -26 ${headR} -26 ${headR} 1 C${headR - 6} -8 ${-6} -12 ${-headR} 1 Z`, fill: look.hair }, head);
  }
  return {
    g,
    /** x, y feet; walked distance drives the stride; facing -1 left, 1 right, 0 front; raise lifts the right hand. */
    set(o) {
      const walking = o.walking ?? 0;
      const phase = (o.walked ?? 0) / (34 * k);
      const swing = Math.sin(2 * Math.PI * phase) * 24 * walking;
      const bob = -Math.abs(Math.cos(2 * Math.PI * phase)) * 2.4 * walking;
      set(g, { transform: `translate(${n2(o.x)} ${n2(o.y)})`, opacity: n3(o.alpha ?? 1) });
      set(fig, { transform: `translate(0 ${n2(bob)}) rotate(${n2((o.facing ?? 0) * 3 * walking)})` });
      legs.forEach((l, i) => set(l.leg, { transform: `translate(${l.x} ${hipY}) rotate(${n2(i ? swing : -swing)})` }));
      arms.forEach((a, i) => {
        const raised = i === 1 ? (o.raise ?? 0) : 0;
        const angle = lerp(i ? -swing * 0.8 : swing * 0.8, -158, raised);
        const len = 25 * k * (1 + 0.62 * raised);
        set(a.arm, { transform: `translate(${a.x} ${shoulderY}) rotate(${n2(angle)})` });
        set(a.sleeve, { height: n2(len) });
        set(a.hand, { cy: n2(len - 3 * k) });
      });
      set(face, { transform: `translate(${n2((o.facing ?? 0) * 4.5)} 0)` });
    },
  };
}

/* ---- Signals, seen from the front as on a road map ---- */
/** A three-lamp vehicle signal hanging from an arm; set({red, yellow, green}) takes 0..1 each. */
function signalHead(parent, x, y, poleX, poleBaseY, k = 1.2) {
  const g = el('g', {}, parent);
  el('ellipse', { cx: poleX, cy: poleBaseY + 2, rx: 12, ry: 5, fill: PAL.shadow, opacity: 0.25, filter: 'url(#blur2)' }, g);
  const armY = y - 30 * k - 8;
  el('rect', { x: poleX - 4.5, y: armY, width: 9, height: poleBaseY - armY, rx: 4.5, fill: PAL.post }, g);
  el('rect', { x: Math.min(x, poleX), y: armY - 2, width: Math.abs(poleX - x) + 4, height: 8, rx: 4, fill: PAL.post }, g);
  el('rect', { x: x - 2.5, y: armY + 4, width: 5, height: y - 24 * k - armY - 4, fill: PAL.post }, g);
  const head = el('g', { transform: `translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})` }, g);
  el('rect', { x: x - 76, y: y + 6, width: 152, height: 26, rx: 13, fill: PAL.shadow, opacity: 0.22, filter: 'url(#blur4)' }, head);
  el('rect', { x: x - 78, y: y - 24, width: 156, height: 50, rx: 15, fill: PAL.housing }, head);
  el('rect', { x: x - 74, y: y - 21, width: 148, height: 6, rx: 3, fill: '#FFFFFF', opacity: 0.07 }, head);
  const colors = [PAL.red, PAL.yellow, PAL.green];
  const glows = ['url(#glowRed)', 'url(#glowAmber)', 'url(#glowGreen)'];
  const lamps = [-49, 0, 49].map((dx, i) => ({
    glow: el('circle', { cx: x + dx, cy: y + 1, r: 40, fill: glows[i], opacity: 0 }, head),
    off: el('circle', { cx: x + dx, cy: y + 1, r: 16, fill: PAL.lampOff }, head),
    on: el('circle', { cx: x + dx, cy: y + 1, r: 16, fill: colors[i], opacity: 0 }, head),
  }));
  return {
    g,
    set(o) {
      ['red', 'yellow', 'green'].forEach((key, i) => {
        const v = o[key] ?? 0;
        set(lamps[i].on, { opacity: n3(v) });
        set(lamps[i].glow, { opacity: n3(v * 0.7) });
      });
    },
  };
}
/** The three-colour right-turn arrow signal: a vertical head of red, yellow and green right arrows. */
function arrowSignal(parent, x, y, baseY, k = 1.1) {
  const root = el('g', {}, parent);
  el('ellipse', { cx: x, cy: baseY + 2, rx: 12, ry: 5, fill: PAL.shadow, opacity: 0.25, filter: 'url(#blur2)' }, root);
  el('rect', { x: x - 4.5, y: y + 60, width: 9, height: baseY - y - 60, rx: 4.5, fill: PAL.post }, root);
  const g = el('g', { transform: `translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})` }, root);
  el('rect', { x: x - 20, y: y - 64, width: 54, height: 160, rx: 15, fill: PAL.shadow, opacity: 0.22, filter: 'url(#blur4)' }, g);
  el('rect', { x: x - 27, y: y - 80, width: 54, height: 160, rx: 15, fill: PAL.housing }, g);
  const colors = [PAL.red, PAL.yellow, PAL.green];
  const glows = ['url(#glowRed)', 'url(#glowAmber)', 'url(#glowGreen)'];
  const arrow = 'M-11 -3.5 H2 V-10 L12 0 L2 10 V3.5 H-11 Z';
  const lamps = [-50, 0, 50].map((dy, i) => {
    el('circle', { cx: x, cy: y + dy, r: 19, fill: '#2C2F35' }, g);
    const glow = el('circle', { cx: x, cy: y + dy, r: 42, fill: glows[i], opacity: 0 }, g);
    el('path', { d: arrow, transform: `translate(${x} ${y + dy}) scale(1.15)`, fill: PAL.lampOff }, g);
    const on = el('path', { d: arrow, transform: `translate(${x} ${y + dy}) scale(1.15)`, fill: colors[i], opacity: 0 }, g);
    return { glow, on };
  });
  return {
    g,
    set(o) {
      ['red', 'yellow', 'green'].forEach((key, i) => {
        const v = o[key] ?? 0;
        set(lamps[i].on, { opacity: n3(v) });
        set(lamps[i].glow, { opacity: n3(v * 0.75) });
      });
    },
  };
}

/* ---- Ground: crossing roads with rounded city blocks, sidewalks and lawns ---- */
/**
 * Two roads crossing at the origin, each 2 * half wide; the four blocks are rounded rectangles of
 * sidewalk with a lawn inside. Returns layers to draw on, back to front.
 */
function crossroads(parent, o) {
  const { half, corner, walk } = o;
  const E = 2400;
  const g = el('g', {}, parent);
  const ground = el('g', {}, g);
  el('rect', { x: -E, y: -E, width: 2 * E, height: 2 * E, fill: PAL.road }, ground);
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const x0 = sx > 0 ? half : -E, y0 = sy > 0 ? half : -E, size = E - half;
    el('rect', { x: x0, y: y0, width: size, height: size, rx: corner, fill: PAL.walk }, ground);
    el('rect', { x: x0 + 1.5, y: y0 + 1.5, width: size - 3, height: size - 3, rx: corner - 1.5, fill: 'none', stroke: PAL.walkEdge, 'stroke-width': 3 }, ground);
    el('rect', { x: x0 + (sx > 0 ? walk : 0), y: y0 + (sy > 0 ? walk : 0), width: size - walk, height: size - walk, rx: Math.max(10, corner - walk), fill: PAL.lawn }, ground);
  }

/** Stacks the scenes: each fades in over the previous one across its cue; returns renderAt(seconds). */
function series(scenes) {
  for (const sc of scenes) sc.group = el('g', {}, SVG);
  for (const sc of scenes) sc.update = sc.build(sc.group);
  return function renderAt(seconds) {
    const t = clamp(Number(seconds) || 0, 0, DURATION);
    scenes.forEach((sc, i) => {
      const from = i === 0 ? -1 : sc.start - FADE / 2;
      const to = i === scenes.length - 1 ? DURATION + 1 : sc.end + FADE / 2;
      const on = t >= from && t <= to;
      set(sc.group, { display: on ? 'inline' : 'none' });
      if (!on) return;
      set(sc.group, { opacity: i === 0 ? 1 : n3(smooth(span(t, sc.start - FADE / 2, sc.start + FADE / 2))) });
      sc.update(t - sc.start, t);
    });

/** Real-time preview when the page is opened by hand; the renderer sets __BRIEFING_RENDER__ and calls renderAt itself. */
function preview(renderAt) {
  if (window.__BRIEFING_RENDER__) return;
  window.briefingReady.then(() => {
    const hold = new URLSearchParams(location.search).get('t');
    if (hold !== null) { renderAt(Number(hold)); return; }
    const start = performance.now();
    const loop = (now) => { renderAt(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);

const HALF = 140, CORNER = 76, WALK = 50;

function town(parent, variant) {

  crosswalk(m, true, -236, -170, -HALF + 6, HALF - 6);         // north

    ? [['#D6DEE6', '#C8D2DC'], ['#E9DDCB', '#DFD0BB'], ['#DCE3D5', '#CED8C6'], ['#DCC4B3', '#D0B5A2']]

  roof(d, -470, -470, 230, 214, ...roofs[0]);

    const childGo = smooth(span(t, 1.2, 1.6));
    child.set({ x: cx, y: 192, walked: -cx, walking: childGo, facing: lerp(-0.4, -1, childGo), raise: smooth(span(t, 0.9, 1.3)) });
    parentP.set({ x: px, y: 212, walked: -px, walking: smooth(span(t, 1.3, 1.7)), facing: -1 });
  };
}

// Scene 3 (8-12 s): a right-turn arrow signal: red arrow, the car holds; green arrow, it turns. It opens on
// scene 2's framing (the same car waiting at the same line) and pulls back to bring the signal in.
function sceneArrow(group) {
  const cam = el('g', {}, group);
  const w = town(cam, 2);
  atmosphere(group);
  const arrow = arrowSignal(w.upright, 184, 232, 338);
  const hero = car(w.traffic, 'hero');
  const pathNode = el('path', { fill: 'none', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-dasharray': '2 17', opacity: 0 }, w.over);
  const cross = el('g', { opacity: 0 }, w.over);
  el('circle', { r: 25, fill: PAL.red }, cross);
  el('path', { d: 'M-9 -9 L9 9 M9 -9 L-9 9', stroke: '#FFFFFF', 'stroke-width': 6, 'stroke-linecap': 'round' }, cross);
  const heroRoute = route(LANE_X, 600, 0, [{ line: 360 }, { turn: 90, radius: 170 }, { line: 600 }]);
  const stopS = 600 - (STOP_Y + NOSE);
  const heroKeys = [[-0.3, stopS, 0], [2.2, stopS, 0], [4.4, stopS + 420, 300]];
  set(pathNode, { d: routePath(heroRoute, stopS + NOSE - 6, 600 + 150) });
  const mid = poseAt(heroRoute, stopS + NOSE + 150);
  set(cross, { transform: `translate(${n2(mid.x + 10)} ${n2(mid.y - 6)})` });
  return (t) => {
    const pull = smooth(span(t, 0.05, 1.45));
    aim(cam, lerp(30, track(t, [[1.4, 100, 0], [2.4, 100, 0], [4.4, 170, 50]]), pull),
      lerp(246, track(t, [[1.4, 200, 0], [2.4, 200, 0], [4.4, 170, -20]]), pull), lerp(1.7, 1.28, pull));
    const green = smooth(span(t, 1.85, 2.1));
    arrow.set({ red: 1 - green, green });
    const s = track(t, heroKeys);
    hero.set(poseAt(heroRoute, s), { brake: t < 2.2 ? 1 : 0, side: 'R', blinker: blink(t, 1.5) });
    const shown = smooth(span(t, 0.55, 0.9)) * (1 - smooth(span(t, 3.3, 3.8)));
    set(pathNode, { opacity: n3(0.85 * shown), stroke: green > 0.5 ? PAL.green : PAL.red });
    const crossIn = smooth(span(t, 0.7, 0.95)) * (1 - green);
    set(cross, { opacity: n3(crossIn), transform: `translate(${n2(mid.x + 10)} ${n2(mid.y - 6)}) scale(${n3(lerp(0.6, 1, backOut(span(t, 0.7, 1.1))))})` });
  };
}

const renderAt = series([
  { start: 0, end: 4, build: sceneStop },
  { start: 4, end: 8, build: sceneWait },
  { start: 8, end: 12, build: sceneArrow },
  { start: 12, end: 15, build: (g) => closingBeat(g) },
]);
window.renderAt = renderAt;
renderAt(0);
preview(renderAt);
</script>
